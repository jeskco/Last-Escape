    border: calc(var(--u) * 2.5) solid rgba(255,77,61,.95); animation: ping .5s ease-out forwards; }
  .ping.loot { border-color: rgba(255,176,32,.95); }
  .ping.fire { border-style: double; }

  #ring { position: absolute; width: calc(var(--u) * 140); height: calc(var(--u) * 140); margin: calc(var(--u) * -70) 0 0 calc(var(--u) * -70);
    border-radius: 50%; border: calc(var(--u) * 2) dashed rgba(255,176,32,.8); pointer-events: none;
    opacity: 0; transition: opacity .25s; display: flex; align-items: center; justify-content: center;
    color: rgba(255,176,32,.95); font: 800 calc(var(--u) * 9) system-ui; letter-spacing: .1em; }
  #ring.show { opacity: 1; }
  #toast { position: absolute; left: 50%; top: calc(var(--u) * 20 + env(safe-area-inset-top)); transform: translateX(-50%);
    padding: calc(var(--u) * 7) calc(var(--u) * 16); border-radius: calc(var(--u) * 14); pointer-events: none;

<script>

  var SEC = { 1:[900,260], 2:[420,520], 3:[820,720], 4:[1280,600], 5:[1002,1221], 6:[1655,1185], 7:[2149,1099], 8:[856,1671],
              9:[740,2274], 10:[1425,1400], 11:[1619,1794], 12:[1661,2298], 13:[1434,2752], 14:[1524,784], 15:[232,2758], 16:[732,2758] };
  var DNAME = { 1:"TRENTON", 2:"GREEN PLAINS", 3:"NORTHWOOD", 4:"UPTOWN", 5:"STADIUM", 6:"DOCKS", 7:"UNION ISLAND", 8:"RIVERSIDE", 9:"BROOKVALE",
                10:"DOWNTOWN", 11:"UPTOWN", 12:"NEWTOWN", 13:"CANAL PARK", 14:"WATERSIDE", 15:"WHISTLER'S FOREST", 16:"PINEDALE" };
  var MAPW = 3000, MAPH = 3600, VIEW = 760, SECW = 380;   // VIEW = how many map pixels fit across the radar
  var info = { loc: 16, x: NaN, w: NaN, light: null, bld: 0, ok: false };

  var mapBtn = mk("div", "ctl mapbtn", gMain);
  mapBtn.innerHTML = "<div class='rview'><img class='rmap' src='map.jpg' alt=''></div><div class='bezel'></div><em class='north'>N</em>" +
    "<div class='me'>" + ICON.me + "</div><span class='dname'>PINEDALE</span>";
  els.mapbtn = mapBtn;
  bindHold(mapBtn, "mapbtn", "map");
  var rmap = mapBtn.querySelector(".rmap"), meEl = mapBtn.querySelector(".me"), dnameEl = mapBtn.querySelector(".dname");
  function drawRadar() {
    var D = 106 * U, k = D / VIEW, c = SEC[info.loc] || SEC[16];
    var mx = c[0], my = c[1];
    if (info.bld < 1 && info.x === info.x && info.w > 0) { mx += (info.x / info.w - 0.5) * SECW; }   // walk across the district
    rmap.style.width = (MAPW * k) + "px"; rmap.style.height = (MAPH * k) + "px";
    rmap.style.transform = "translate(" + (D / 2 - mx * k) + "px," + (D / 2 - my * k) + "px)";
    var nm = DNAME[info.loc] || "UNION CITY";
    if (info.bld > 0) { nm += " · INSIDE"; }
    if (dnameEl.textContent !== nm) { dnameEl.textContent = nm; }
  }
  drawRadar(); addEventListener("resize", drawRadar);

  // =====================================================================
  //  WEAPON CARD: picture of the gun in your hands. Tap = swap guns.
  // =====================================================================
  var WIDX = {"hands":0,"fal":1,"deathadder":2,"compoundbow":3,"shotgun":4,"ak47":5,"m16a2":6,"m4a1":7,"scarh":8,"xm8":9,"ppm9":10,"m1911":11,"venom":12,"m9":13,"glock":14,"tauron":15,"sledge":16,"bat":17,"crowbar":18,"kitchenknife":19,"machete":20,"m24":21,"vector":22,"mp5":23,"m79":24,"ump45":25,"chainsaw":26,"uzi":27,"m249":28,"katana":29,"fireaxe":30,"nailboard":31,"shovel":32,"flamethrower":33,"ambrose":34,"thudder":35,"clawhammer":36,"rpg":37,"hunter":38,"handgrenade":39,"thor":40,"m82":41,"pocketknife":42,"hatchet":43,"cleaver":44,"tireiron":45,"pipe":46,"cricketbat":47,"golfclub":48,"hockeystick":49,"sawnoff":50,"woodboard":51,"guitar":52,"mace":53,"battleaxe":54,"policebaton":55,"sickle":56,"hellslinger":57};
  var sheet = new Image(), cache = {}, sheetOK = false;
  sheet.onload = function () { sheetOK = true; cache = {}; wBig._key = null; pollWeapon(); };
  sheet.src = "weapons.png";
  // cut one gun out of the sheet and trim the empty space around it so it fills the card
  function gunPic(k) {
    if (cache[k]) { return cache[k]; }
    if (!sheetOK) { return null; }
    try {
      var cw = sheet.naturalWidth / 5, ch = sheet.naturalHeight / 12;
      var c = document.createElement("canvas"); c.width = Math.round(cw); c.height = Math.round(ch);
      var x = c.getContext("2d"); x.drawImage(sheet, (k % 5) * cw, Math.floor(k / 5) * ch, cw, ch, 0, 0, c.width, c.height);
      var d = x.getImageData(0, 0, c.width, c.height).data, x0 = c.width, y0 = c.height, x1 = -1, y1 = -1, i, px, py;
      for (py = 0; py < c.height; py++) { for (px = 0; px < c.width; px++) {
        if (d[(py * c.width + px) * 4 + 3] > 24) { if (px < x0) { x0 = px; } if (px > x1) { x1 = px; } if (py < y0) { y0 = py; } if (py > y1) { y1 = py; } } } }
      if (x1 < 0) { return null; }
      var o = document.createElement("canvas"); o.width = x1 - x0 + 1; o.height = y1 - y0 + 1;
      o.getContext("2d").drawImage(c, x0, y0, o.width, o.height, 0, 0, o.width, o.height);
      return (cache[k] = o.toDataURL("image/png"));
    } catch (e) { return null; }
  }
  var wBig = mk("div", "ctl wcard", gMain);
  wBig.innerHTML = "<span class='wtop'>EQUIPPED</span><span class='wswap'>" + ICON.swap + "</span>" +
    "<div class='wimgbox'><img class='wimg' alt=''><span class='wfist'>" + ICON.shove + "</span></div><div class='wname'></div>";
  var wImg = wBig.querySelector(".wimg"), wFist = wBig.querySelector(".wfist"), wName = wBig.querySelector(".wname");
  wBig._key = null; els.wbig = wBig;
  bindHold(wBig, "wbig", "swap");
  function wShow(raw) {
    var name = String(raw), dmg = false;
    var base = name.replace(/_.*$/, ""), low = base.toLowerCase();
    var k = WIDX[low];
    var key = low + (dmg ? "!" : "") + (sheetOK ? "+" : "-");
    if (wBig._key === key) { return; }
    var pic = (k !== undefined && k > 0) ? gunPic(k) : null;
    var nice = (!base || low === "undefined" || low === "hands" || low === "none" || low === "null") ? "FISTS" : base.replace(/([a-z])([A-Z0-9])/g, "$1 $2").toUpperCase();
    if (pic) { wImg.src = pic; wImg.style.display = "block"; wFist.style.display = "none"; }
    else { wImg.style.display = "none"; wFist.style.display = (nice === "FISTS") ? "block" : "none"; }
    wName.textContent = nice;
    wBig._key = key;
  }
  wShow("hands");
  function pollWeapon() {
    try {
      if (!player || typeof player.padWeapon !== "function") { return; }
      wShow(String(player.padWeapon()).split(",")[0]);
    } catch (e) {}
  }
  setInterval(pollWeapon, 400);

  // ---- round buttons ----
  ROUND.forEach(function (d) {
    var el = mk("div", "ctl " + d[8] + " " + d[9], document.getElementById(d[10]));
    el.innerHTML = ICON[d[2]] + "<span>" + d[3] + "</span>";
    pos(el, d[4], d[5], d[6], d[7]);
    els[d[0]] = el; bindHold(el, d[0], d[1]);
  });

  // ---- flashlight (under the weapon card) ----
  var tools = mk("div", "tools", gMain);
  var litBtn = mk("div", "ctl lite", tools); litBtn.innerHTML = ICON.light; els.light = litBtn; bindHold(litBtn, "light", "light");
  var lightLocal = false;
  litBtn._tap = function () { if (!info.ok || info.light === null) { lightLocal = !lightLocal; litBtn.classList.toggle("on", lightLocal); } };

  // BREAK: hold to mash left/right (A/D) so a zombie grab can be escaped whichever side the game wants
  var mashT = 0, mashStep = 0, MASH = [[-1, 50], [0, 40], [1, 50], [0, 40]];
  function mashTick() { var m = MASH[mashStep++ % 4]; call("move", m[0], 0); mashT = setTimeout(mashTick, m[1]); }
  function stopMash() { clearTimeout(mashT); mashT = 0; call("move", 0, 0); }
  els.mash._down = function () { if (!mashT) { mashStep = 0; mashTick(); } };
  els.mash._up = stopMash;

  // back button (menus) and PAD on/off live in their own groups so they stay reachable
  (function () {
    var b = mk("div", "ctl chip", document.getElementById("gBack")); b.textContent = "◂ BACK"; b.style.position = "fixed";
    b.style.left = "calc(var(--u) * 16 + env(safe-area-inset-left))"; b.style.top = "calc(var(--u) * 60 + env(safe-area-inset-top))";
    els.back = b; bindHold(b, "back", "back");
  })();

  function ping(x, y, kind) {
    var p = mk("div", "ping " + (kind || ""), gMain); p.style.left = x + "px"; p.style.top = y + "px";
    setTimeout(function () { if (p.parentNode) { p.parentNode.removeChild(p); } }, 600);
  }
  // ---- tap an object to loot it (only when you are close enough) ----
  var tlOn = true;   // tap-to-loot is always on
  var STAGE_W = 760, STAGE_H = 400;
  function layoutZone() {
    if (!player) { return; }
    var r = player.getBoundingClientRect(); if (!r.width) { return; }
    var sc = Math.min(r.width / STAGE_W, r.height / STAGE_H);
    var oy = r.top + (r.height - STAGE_H * sc) / 2;
    zone.style.top = Math.max(0, oy + 55 * sc) + "px";                       // below the game's top HUD strip
    zone.style.bottom = Math.max(0, innerHeight - (oy + 345 * sc)) + "px";  // above the game's bottom tab menu
  }
  addEventListener("resize", layoutZone); addEventListener("orientationchange", layoutZone);
  function tapLootAt(cx, cy) {
    if (!tlOn || !player) { return 0; }
    var r = player.getBoundingClientRect();
    var sc = Math.min(r.width / STAGE_W, r.height / STAGE_H);
    var ox = r.left + (r.width - STAGE_W * sc) / 2, oy = r.top + (r.height - STAGE_H * sc) / 2;
    var sx = (cx - ox) / sc, sy = (cy - oy) / sc;
    if (sx < 0 || sx > STAGE_W || sy < 55 || sy > 345) { return 0; }   // leave the game's own HUD alone
    return +call("tapl", sx, sy) || 0;
  }
  function tap(x, y) {
    var tl = tapLootAt(x, y);
    if (tl === 1) {          // a lootable object under your finger and in reach: open / pick it up
      ping(x, y, "loot"); vib(14);
      fireSrc = {}; call("up", "fire"); call("up", "jump");   // the game ignores E while firing or jumping
      return;
    }
    if (tl === 2) { ping(x, y, "loot"); toast("Too far - move closer to it", 1500); }
  }

  // ---- gesture surface: drag on the left = move stick. Tap an item = loot. Aiming is automatic (nearest enemy). ----
  var MOVE_ZONE = 0.5;      // left half of the screen drags as the move stick
  function stickUI(g) {
    fMove.style.left = g.x0 + "px"; fMove.style.top = g.y0 + "px"; fMove.classList.add("show");
    ghost.classList.add("hide");
  }
  function stickUpdate(g) {
    var R = 56 * U, dx = g.x - g.x0, dy = g.y - g.y0, len = Math.sqrt(dx * dx + dy * dy);
    var nx = dx / R, ny = dy / R;
    if (len > R) { nx = dx / len; ny = dy / len; }
    kMove.style.transform = "translate(" + (nx * R * 0.62) + "px," + (ny * R * 0.62) + "px)";
    call("move", nx, ny);
  }
  zone.addEventListener("pointerdown", function (e) {
    if (G[e.pointerId]) { return; }
    G[e.pointerId] = { id: e.pointerId, x0: e.clientX, y0: e.clientY, x: e.clientX, y: e.clientY, t: Date.now(), kind: null,
                       left: e.clientX < innerWidth * MOVE_ZONE };
    try { zone.setPointerCapture(e.pointerId); } catch (x) {}
    e.preventDefault();
  });
  zone.addEventListener("pointermove", function (e) {
    var g = G[e.pointerId]; if (!g) { return; }
    g.x = e.clientX; g.y = e.clientY;
    if (!g.left) { return; }
    if (!g.kind) {
      if (Math.hypot(g.x - g.x0, g.y - g.y0) < 10) { return; }
      for (var k in G) { if (G[k] !== g && G[k].kind === "move") { return; } }
      g.kind = "move"; stickUI(g);
    }
    stickUpdate(g);
  });
  function gEnd(e) {
    var g = G[e.pointerId]; if (!g) { return; }
    delete G[e.pointerId];
    if (g.kind === "move") { call("move", 0, 0); fMove.classList.remove("show"); kMove.style.transform = ""; ghost.classList.remove("hide"); }
    else if (e.type === "pointerup" && Date.now() - g.t < 320 && Math.hypot(g.x - g.x0, g.y - g.y0) < 14 * U) { tap(g.x0, g.y0); }
  }
  zone.addEventListener("pointerup", gEnd); zone.addEventListener("pointercancel", gEnd);

  function releaseAll() {
    Object.keys(held).forEach(function (k) { delete held[k]; if (els[k]) { els[k].classList.remove("pressed"); } });
    Object.keys(fireSrc).forEach(function (k) { delete fireSrc[k]; }); call("up", "fire");
    Object.keys(G).forEach(function (k) { delete G[k]; });
    call("move", 0, 0); fMove.classList.remove("show"); ghost.classList.remove("hide");
    stopMash();
  }

  var lastMode = -1, introShown = false;
  try { introShown = !!localStorage.getItem("uc_intro"); } catch (e) {}
  function render() {
    var show = ext && st.mode > 0;
    padEl.style.display = show ? "block" : "none";
    padEl.className = "m" + st.mode + (st.pad ? "" : " off");
    if (st.mode !== 1 && lastMode === 1) { releaseAll(); }
    if (st.mode === 1 && lastMode !== 1 && !introShown) {
      introShown = true; try { localStorage.setItem("uc_intro", "1"); } catch (e) {}
      toast("Drag the left side to move (up = jump, down = crouch) · FIRE auto-aims at the nearest enemy · Tap an item or container to loot it · Grabbed? Hold BREAK", 6500);
    }
    lastMode = st.mode;
    els.fire.classList.toggle("on", !!st.fire); els.sprint.classList.toggle("on", !!st.sprint);
  }

  // where am I? (district, spot along the street, flashlight) -> radar + flashlight glow
  function pollInfo() {
    try {
      if (!player || typeof player.padInfo !== "function") { return; }
      var p = String(player.padInfo()).split(",");
      var loc = parseInt(p[0], 10);
      if (loc > 0) { info.loc = loc; }
      info.x = parseFloat(p[1]); info.w = parseFloat(p[2]);
      info.light = p[3] === "on" ? true : (p[3] === "off" ? false : null);
      info.bld = parseInt(p[4], 10) || 0;
      var ax = parseFloat(p[5]), ay = parseFloat(p[6]);
      if (ax === ax && ay === ay && (Math.abs(ax) + Math.abs(ay)) > 1) { meEl.style.transform = "rotate(" + (Math.atan2(ax, -ay) * 180 / Math.PI) + "deg)"; }
      info.ok = true;
      if (info.light !== null) { litBtn.classList.toggle("on", info.light); }
      drawRadar();
    } catch (e) {}
  }
  setInterval(pollInfo, 200);

  function poll() {
    if (!player) { return; }
    try {
      if (typeof player.padCmd !== "function") { return; }
      if (!ext) { player.padCmd("ext", 1); ext = true; }
      var p = String(player.padCmd("state")).split(",");
      st.mode = +p[0]; st.fire = +p[1]; st.auto = +p[2]; st.sprint = +p[3]; st.pad = +p[4];
      render(); layoutZone();
    } catch (e) {}
  }

  window.addEventListener("DOMContentLoaded", function () {
    var ruffle = window.RufflePlayer.newest();
    player = ruffle.createPlayer();
    document.getElementById("stage").appendChild(player);
    player.load({ url: "game.swf" });
    setInterval(poll, 100);
  });
  window.__pad = { st: st, els: els, call: call, info: info, anchor: function () { return anchor; } };   // for debugging
})();
</script>
</body>
</html>
