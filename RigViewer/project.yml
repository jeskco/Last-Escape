name: RigViewer
options:
  bundleIdPrefix: com.rigviewer
  deploymentTarget:
    iOS: "17.0"
packages:
  GLTFKit2:
    url: https://github.com/warrenm/GLTFKit2
    from: 0.5.15
targets:
  RigViewer:
    type: application
    platform: iOS
    sources:
      - path: RigViewer
    dependencies:
      - package: GLTFKit2
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.rigviewer.native
        PRODUCT_NAME: RigViewer
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1,2"
        INFOPLIST_FILE: RigViewer/Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        MARKETING_VERSION: "2.3"
        CURRENT_PROJECT_VERSION: "1"
        CODE_SIGNING_ALLOWED: "NO"
        CODE_SIGNING_REQUIRED: "NO"
        ENABLE_USER_SCRIPT_SANDBOXING: "NO"
        SWIFT_OBJC_BRIDGING_HEADER: RigViewer/RigViewer-Bridging-Header.h
        CLANG_ENABLE_OBJC_ARC: "YES"
        GCC_WARN_INHIBIT_ALL_WARNINGS: "NO"
