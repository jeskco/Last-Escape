name: ApexF40
options:
  bundleIdPrefix: com.apexf40
  deploymentTarget:
    iOS: "17.0"
packages:
  GLTFKit2:
    url: https://github.com/warrenm/GLTFKit2
    from: 0.5.15
targets:
  ApexF40:
    type: application
    platform: iOS
    sources:
      - path: ApexF40
      - path: Resources/World
        type: folder
        buildPhase: resources
      - path: Resources/Textures
        type: folder
        buildPhase: resources
      - path: Resources/Models
        type: folder
        buildPhase: resources
    dependencies:
      - package: GLTFKit2
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.apexf40.openworld
        PRODUCT_NAME: ApexF40
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1,2"
        INFOPLIST_FILE: ApexF40/Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        MARKETING_VERSION: "2.0.3"
        CURRENT_PROJECT_VERSION: "3"
        CODE_SIGNING_ALLOWED: "NO"
        CODE_SIGNING_REQUIRED: "NO"
        ENABLE_USER_SCRIPT_SANDBOXING: "NO"
        SWIFT_OPTIMIZATION_LEVEL: "-O"
        SWIFT_OBJC_BRIDGING_HEADER: ApexF40/ApexF40-Bridging-Header.h
        CLANG_ENABLE_OBJC_ARC: "YES"
