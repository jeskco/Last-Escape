name: NeonScore
options:
  bundleIdPrefix: com.jesk
  deploymentTarget:
    iOS: "17.0"
  developmentLanguage: en
targets:
  NeonScore:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: NeonScore
        excludes:
          - Info.plist
    info:
      path: NeonScore/Info.plist
      properties:
        CFBundleDisplayName: NeonScore
        UILaunchScreen: {}
        UIUserInterfaceStyle: Dark
        LSApplicationCategoryType: public.app-category.sports
        NSSupportsLiveActivities: true
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        UIBackgroundModes: [fetch]
        BGTaskSchedulerPermittedIdentifiers: [com.jesk.neonscore.refresh]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.jesk.neonscore
        PRODUCT_NAME: NeonScore
        MARKETING_VERSION: "1.0.0"
        CURRENT_PROJECT_VERSION: "1"
        SWIFT_VERSION: "5.0"
        DEVELOPMENT_TEAM: ""
        CODE_SIGNING_ALLOWED: "NO"
        CODE_SIGNING_REQUIRED: "NO"
        TARGETED_DEVICE_FAMILY: "1,2"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
